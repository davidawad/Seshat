image: node:22

stages:
  - test
  - deploy

variables:
  PNPM_HOME: .pnpm-home
  # Release notes are generated from the commit history and its v*.*.* tags at build
  # time, so jobs need a full clone, not GitLab's default shallow one.
  GIT_DEPTH: '0'

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

before_script:
  # Belt and braces for runners that still hand out a shallow clone or no tags. A failure
  # here is not fatal: the release notes page then says its history is incomplete.
  - git fetch --tags --force || true
  - if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then git fetch --unshallow --tags || true; fi
  - corepack enable
  - pnpm config set store-dir .pnpm-store
  - pnpm install --frozen-lockfile

test:
  stage: test
  script:
    - pnpm run ci

pages:
  stage: deploy
  needs: ['test']
  script:
    - pnpm run build
    # GitLab Pages has no server-side SPA fallback — a direct hit or
    # refresh on a client-side route (e.g. /sets/abc123) 404s unless the
    # 404 page itself is the app shell, letting react-router take over.
    - cp dist/index.html dist/404.html
  publish: dist
  artifacts:
    paths:
      - dist
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
